spring:
  application:
    name: jr-hotel
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 4040

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

aws:
  s3:
    access:
      key: ${AWS_S3_ACCESS_KEY:dummy-access-key}
    secret:
      key: ${AWS_S3_SECRET_KEY:dummy-secret-key}
