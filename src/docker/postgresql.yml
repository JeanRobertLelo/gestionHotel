services:
  postgresql:
    image: bitnami/postgresql:latest
    container_name: jr_hotel_postgresql
    ports:
      - "5435:5432"
    environment:
      POSTGRESQL_DATABASE: jr_hotel
      POSTGRESQL_USERNAME: jr_hotel
      POSTGRESQL_PASSWORD: jr_hotel
      POSTGRESQL_POSTGRES_PASSWORD: postgres
    volumes:
      - jr_hotel_postgresql_data:/bitnami/postgresql
    networks:
      - jr_hotel_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jr_hotel_pgadmin
    depends_on:
      - postgresql
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jr-hotel.fr
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - jr_hotel_pgadmin_data:/var/lib/pgadmin
    networks:
      - jr_hotel_network

  maildev:
    image: maildev/maildev:latest
    container_name: jr_hotel_maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - jr_hotel_network

volumes:
  jr_hotel_postgresql_data:
  jr_hotel_pgadmin_data:

networks:
  jr_hotel_network:
    driver: bridge
